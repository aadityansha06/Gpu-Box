name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: js/package-lock.json

    - name: Install dependencies
      working-directory: ./js
      run: npm ci || npm install

    - name: Build JS SDK bundle
      working-directory: ./js
      run: npm run build

    - name: Execute 175-test automated verification suite
      working-directory: ./js
      run: npm test

    - name: Verify reports and documentation consistency (no drift)
      run: |
        node scripts/generate-reports.js
        git diff --exit-code || (echo "Documentation or report drift detected! Run node scripts/generate-reports.js and commit changes." && exit 1)
